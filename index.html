<style>
:root{
  --paper:#ffffff;
  --ink:#181e24;
  --muted:#6b7580;
  --line:#e5e8ec;
  --accent:#22627f;
  --font-display:"Instrument Serif",Georgia,"Times New Roman",serif;
  --font-body:"Karla",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  background-color:var(--paper);
  background-image:url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22200%22%20height%3D%22200%22%20viewBox%3D%220%200%20200%20200%22%3E%3Cg%20fill%3D%22none%22%20stroke-width%3D%223.4%22%20stroke-linecap%3D%22round%22%3E%3Cpath%20d%3D%22M15.4%2021.8L20.6%2030.2%22%20stroke%3D%22%23d9e5ec%22%2F%3E%3Cpath%20d%3D%22M74.2%209.8L69.8%2018.2%22%20stroke%3D%22%23f0e2cb%22%2F%3E%3Cpath%20d%3D%22M132.6%2028.4L131.4%2039.6%22%20stroke%3D%22%23e6dced%22%2F%3E%3Cpath%20d%3D%22M170.1%2076.9L181.9%2079.1%22%20stroke%3D%22%23dde9de%22%2F%3E%3Cpath%20d%3D%22M38.2%2069.3L49.8%2070.7%22%20stroke%3D%22%23f2dcdc%22%2F%3E%3Cpath%20d%3D%22M99.3%2087.0L108.7%2089.0%22%20stroke%3D%22%23d9e5ec%22%2F%3E%3Cpath%20d%3D%22M156.4%20125.2L159.6%20138.8%22%20stroke%3D%22%23f0e2cb%22%2F%3E%3Cpath%20d%3D%22M23.2%20122.0L32.8%20126.0%22%20stroke%3D%22%23e6dced%22%2F%3E%3Cpath%20d%3D%22M86.9%20145.2L81.1%20158.8%22%20stroke%3D%22%23dde9de%22%2F%3E%3Cpath%20d%3D%22M141.4%20170.5L138.6%20181.5%22%20stroke%3D%22%23f2dcdc%22%2F%3E%3Cpath%20d%3D%22M194.6%2019.7L185.4%2020.3%22%20stroke%3D%22%23d9e5ec%22%2F%3E%3Cpath%20d%3D%22M12.8%20173.7L3.2%20178.3%22%20stroke%3D%22%23f0e2cb%22%2F%3E%3C%2Fg%3E%3C%2Fsvg%3E");
  background-repeat:repeat;
  background-attachment:fixed;
  background-size:300px 300px;
  color:var(--ink);
  font-family:var(--font-body);
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
.wrap{max-width:44rem;margin:0 auto;padding-block:2.2rem 3.5rem;padding-left:1.1rem;padding-right:1.1rem}

.pets{display:flex;gap:.55rem;margin:0 0 1.4rem}
.pets img{width:4.4rem;height:4.4rem;max-width:100%;border-radius:50%;display:block;
  background:var(--paper);box-shadow:0 0 0 .35rem var(--paper)}

.eyebrow{font-size:.7rem;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:0 0 .6rem}
h1{font-family:var(--font-display);font-weight:400;font-size:clamp(2.4rem,11vw,3.4rem);
  line-height:1.05;margin:0;text-wrap:balance;letter-spacing:-.01em}
h1 em{font-style:italic}
.lede{color:var(--muted);margin:.7rem 0 0;max-width:33rem;font-size:1rem}

.meter{margin-top:1.8rem;display:flex;flex-direction:column;gap:.5rem}
.meter-top{display:flex;justify-content:space-between;align-items:baseline;gap:1rem;font-size:.85rem;color:var(--muted)}
.meter-top b{font-variant-numeric:tabular-nums;font-size:1.05rem;font-weight:700;color:var(--ink)}
.track{height:3px;background:var(--line);overflow:hidden}
.bar{height:100%;width:0;background:var(--accent);transition:width .3s ease}

.filters{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:1.5rem}
.chip{font:inherit;font-size:.85rem;font-weight:500;cursor:pointer;padding:.45rem .8rem;
  border-radius:99px;border:1px solid var(--line);background:var(--paper);color:var(--muted);
  -webkit-tap-highlight-color:transparent;touch-action:manipulation}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.chip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

h2{font-family:var(--font-display);font-weight:400;font-size:1.5rem;
  margin:2.6rem 0 .15rem;display:flex;align-items:center;gap:.55rem;flex-wrap:wrap}
h2 img{width:2.2rem;height:2.2rem;border-radius:50%;flex:none;max-width:100%;
  background:var(--paper);box-shadow:0 0 0 .25rem var(--paper)}
h2 small{font-family:var(--font-body);font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;
  color:var(--muted);font-weight:700}
.sec-note{color:var(--muted);font-size:.88rem;margin:.15rem 0 .9rem}

ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;background:var(--paper)}
li.card{border-top:1px solid var(--line);padding:.9rem .5rem;
  display:grid;grid-template-columns:auto 1fr;gap:.8rem;align-items:start;
  cursor:pointer;-webkit-tap-highlight-color:transparent}
li.card:last-child{border-bottom:1px solid var(--line)}
li.card.done .title{color:var(--muted);text-decoration:line-through}

.box{appearance:none;-webkit-appearance:none;margin:.15rem 0 0;flex:none;
  width:1.45rem;height:1.45rem;border:1.5px solid var(--line);
  border-radius:5px;background:transparent;cursor:pointer;position:relative;touch-action:manipulation}
.box:checked{background:var(--accent);border-color:var(--accent)}
.box:checked::after{content:"";position:absolute;left:.46rem;top:.18rem;width:.32rem;height:.68rem;
  border:solid #fff;border-width:0 2px 2px 0;transform:rotate(42deg)}
.box:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.body{min-width:0;display:flex;flex-direction:column;gap:.3rem}
.title{font-weight:700;font-size:1rem;margin:0;overflow-wrap:anywhere}
.num{color:var(--muted);font-variant-numeric:tabular-nums;margin-right:.45rem;font-size:.82rem;font-weight:500}
.row{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;margin-top:.4rem}
input[type="date"]{font:inherit;font-size:1rem;font-variant-numeric:tabular-nums;color:var(--ink);
  background:var(--paper);border:1px solid var(--line);border-radius:7px;padding:.4rem .55rem;
  min-width:0;max-width:100%;min-height:2.4rem;cursor:pointer}
input[type="date"]:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.cal{font:inherit;font-size:.9rem;font-weight:500;text-decoration:none;border:1px solid var(--line);
  color:var(--accent);background:var(--paper);padding:.5rem .8rem;border-radius:7px;white-space:nowrap;
  display:inline-flex;align-items:center;min-height:2.4rem;touch-action:manipulation}
.cal[aria-disabled="true"]{color:var(--muted);opacity:.45;pointer-events:none}
.cal:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

footer{margin-top:2.8rem;border-top:1px solid var(--line);padding-top:1.3rem;background:var(--paper)}
.reset{font:inherit;font-size:.85rem;background:transparent;border:1px solid var(--line);
  color:var(--muted);border-radius:7px;padding:.5rem .85rem;cursor:pointer;min-height:2.4rem;
  touch-action:manipulation}
.reset:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

@media (max-width:460px){
  .wrap{padding-left:1rem;padding-right:1rem}
  .pets img{width:3.5rem;height:3.5rem;box-shadow:0 0 0 .28rem var(--paper)}
  .pets{gap:.45rem}
  li.card{padding:.9rem .25rem;gap:.7rem}
  h2{font-size:1.4rem;margin-top:2.3rem}
  .row{gap:.45rem}
  .cal{flex:1 1 auto;justify-content:center}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

const KEY = "kaertchen30-v3";
let state = {checked:{}, dates:{}};
try{ const raw = localStorage.getItem(KEY); if(raw) state = Object.assign(state, JSON.parse(raw)); }catch(e){}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} }
function dateFor(i){ return (i in state.dates) ? state.dates[i] : ITEMS[i].d; }

function gcal(i){
  const iso = dateFor(i);
  if(!iso) return null;
  const start = iso.replace(/-/g,"");
  const dt = new Date(iso + "T12:00:00");
  dt.setDate(dt.getDate() + 1);
  const end = dt.getFullYear() + String(dt.getMonth()+1).padStart(2,"0") + String(dt.getDate()).padStart(2,"0");
  const p = new URLSearchParams({
    action:"TEMPLATE",
    text:"🎁 " + ITEMS[i].t,
    dates: start + "/" + end,
    details:"Kärtchen zum 30er"
  });
  return "https://calendar.google.com/calendar/render?" + p.toString();
}

const listEl = document.getElementById("list");
const filtersEl = document.getElementById("filters");
let filter = "all";

function render(){
  listEl.textContent = "";
  GROUPS.forEach(g => {
    if(filter !== "all" && filter !== g.k) return;
    const idx = ITEMS.map((it,i)=>[it,i]).filter(([it])=>it.g===g.k);
    if(!idx.length) return;
    idx.sort((a,b)=>{
      const da = dateFor(a[1]), db = dateFor(b[1]);
      if(da && db) return da < db ? -1 : da > db ? 1 : a[1]-b[1];
      if(da) return -1;
      if(db) return 1;
      return a[1]-b[1];
    });
    const h = document.createElement("h2");
    const pic = document.createElement("img"); pic.src = g.img; pic.alt = "";
    h.append(pic, g.name);
    const s = document.createElement("small"); s.textContent = g.when; h.append(s);
    listEl.append(h);
    const n = document.createElement("p"); n.className="sec-note"; n.textContent = g.note;
    listEl.append(n);
    const ol = document.createElement("ol");
    idx.forEach(([it,i]) => ol.append(card(it,i)));
    listEl.append(ol);
  });
  updateMeter();
}

function card(it, i){
  const li = document.createElement("li");
  li.className = "card" + (state.checked[i] ? " done" : "");

  const cb = document.createElement("input");
  cb.type="checkbox"; cb.className="box"; cb.id="chk"+i; cb.checked=!!state.checked[i];
  cb.setAttribute("aria-label", it.t);

  function setChecked(v){
    cb.checked = v;
    state.checked[i] = v;
    save();
    li.classList.toggle("done", v);
    updateMeter();
  }
  cb.addEventListener("change", ()=> setChecked(cb.checked));
  li.addEventListener("click", (e)=>{
    if(e.target === cb) return;
    if(e.target.closest("input, a, button")) return;
    setChecked(!cb.checked);
  });

  const body = document.createElement("div"); body.className="body";
  const t = document.createElement("p"); t.className="title";
  const num = document.createElement("span"); num.className="num"; num.textContent = String(i+1).padStart(2,"0");
  t.append(num, document.createTextNode(it.t));

  const row = document.createElement("div"); row.className="row";
  const di = document.createElement("input");
  di.type="date"; di.id="date"+i; di.value = dateFor(i);
  di.setAttribute("aria-label","Datum für: " + it.t);
  const a = document.createElement("a");
  a.className="cal"; a.target="_blank"; a.rel="noopener"; a.textContent="In Kalender";
  function syncLink(){
    const url = gcal(i);
    if(url){ a.href = url; a.removeAttribute("aria-disabled"); }
    else { a.removeAttribute("href"); a.setAttribute("aria-disabled","true"); }
  }
  di.addEventListener("change", ()=>{ state.dates[i]=di.value; save(); syncLink(); });
  syncLink();

  row.append(di, a);
  body.append(t, row);
  li.append(cb, body);
  return li;
}

function updateMeter(){
  const total = ITEMS.length;
  const done = ITEMS.reduce((n,_,i)=> n + (state.checked[i]?1:0), 0);
  document.getElementById("count").textContent = done + " / " + total;
  document.getElementById("bar").style.width = (done/total*100).toFixed(1) + "%";
  document.getElementById("countword").textContent = done===total ? "alle aufgemacht" : "aufgemacht";
}

function buildFilters(){
  const defs = [{k:"all",name:"Alle"}].concat(GROUPS.map(g=>({k:g.k,name:g.name})));
  defs.forEach(d=>{
    const b=document.createElement("button");
    b.type="button"; b.className="chip"; b.textContent=d.name;
    b.setAttribute("aria-pressed", String(filter===d.k));
    b.addEventListener("click", ()=>{
      filter=d.k;
      [...filtersEl.children].forEach(c=>c.setAttribute("aria-pressed", String(c.textContent===d.name)));
      render();
      window.scrollTo({top:0,behavior:"smooth"});
    });
    filtersEl.append(b);
  });
}

document.getElementById("reset").addEventListener("click", ()=>{
  state={checked:{},dates:{}}; save(); render();
});

buildFilters();
render();
</script>
