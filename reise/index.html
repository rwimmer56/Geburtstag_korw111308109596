<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#ffffff">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ein Monat">
<title>Ein Monat mit dir</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Karla:wght@400;500;700&display=swap">
<script>if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("../sw.js").catch(function(){})});}</script>
<style>
:root{
  --paper:#ffffff;
  --ink:#181e24;
  --muted:#6b7580;
  --line:#e5e8ec;
  --accent:#22627f;
  --font-display:"Instrument Serif",Georgia,"Times New Roman",serif;
  --font-body:"Karla",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  color-scheme:light;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
html,body{margin:0}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:var(--font-body);
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
img{max-width:100%;display:block}
.wrap{max-width:52rem;margin:0 auto;padding-block:2.2rem 3.5rem;padding-left:1.1rem;padding-right:1.1rem}

h1{font-family:var(--font-display);font-weight:400;font-size:clamp(2.4rem,11vw,3.4rem);
  line-height:1.05;margin:0;text-wrap:balance;letter-spacing:-.01em}
.lede{color:var(--muted);margin:.7rem 0 0;max-width:30rem;font-size:1rem}

.hero{margin-top:1.6rem;position:relative;cursor:zoom-in}
.hero img{width:100%;height:auto;border-radius:3px;background:#f2f4f6}
.hero .cap{font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);
  font-weight:700;margin-top:.6rem}

.grid{margin-top:2rem;columns:2;column-gap:.6rem}
@media (min-width:640px){.grid{columns:3;column-gap:.7rem}}
.cell{break-inside:avoid;margin-bottom:.6rem;position:relative;cursor:zoom-in}
.cell img{width:100%;height:auto;border-radius:3px;background:#f2f4f6}
.cell .d{position:absolute;left:.45rem;bottom:.45rem;font-size:.64rem;letter-spacing:.08em;
  text-transform:uppercase;font-weight:700;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.6);opacity:.9}

.again{display:block;margin:2.4rem auto 0;font:inherit;font-size:.88rem;font-weight:500;
  background:transparent;border:1px solid var(--line);color:var(--muted);
  border-radius:99px;padding:.6rem 1.3rem;cursor:pointer;min-height:2.6rem;touch-action:manipulation}
.again:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

footer{margin-top:2.6rem;border-top:1px solid var(--line);padding-top:1.2rem;
  color:var(--muted);font-size:.85rem}
footer p{margin:0}

#lb{position:fixed;inset:0;background:rgba(14,18,22,.97);display:none;z-index:50;
  align-items:center;justify-content:center;padding:env(safe-area-inset-top,0px) .5rem env(safe-area-inset-bottom,0px);
  touch-action:none;overscroll-behavior:contain;-webkit-tap-highlight-color:transparent}
#lb.on{display:flex}
#lbstage{position:relative;display:flex;align-items:center;justify-content:center;
  width:100%;height:100%;will-change:transform}
#lb img{max-width:100%;max-height:82vh;width:auto;border-radius:2px;pointer-events:none;-webkit-user-select:none;user-select:none}
#lbstage.snap{transition:transform .22s ease-out}
#lbd{position:absolute;bottom:calc(env(safe-area-inset-bottom,0px) + 1.4rem);left:0;right:0;text-align:center;
  color:#e8edf2;font-size:.74rem;letter-spacing:.12em;text-transform:uppercase;font-weight:700;opacity:.8;
  pointer-events:none}
#lbn{position:absolute;top:calc(env(safe-area-inset-top,0px) + 1rem);left:0;right:0;text-align:center;
  color:#e8edf2;font-size:.72rem;font-variant-numeric:tabular-nums;opacity:.5;pointer-events:none}
#lbclose{position:absolute;top:calc(env(safe-area-inset-top,0px) + .5rem);right:.6rem;background:none;border:0;
  color:#fff;font-size:1.9rem;line-height:1;opacity:.6;cursor:pointer;padding:.4rem .7rem;touch-action:manipulation}
.nav{position:absolute;top:50%;transform:translateY(-50%);background:none;border:0;color:#fff;
  font-size:2rem;opacity:.5;cursor:pointer;padding:1.2rem .9rem;line-height:1;touch-action:manipulation}
.nav:hover,#lbclose:hover{opacity:1}
#prev{left:0}#next{right:0}
@media (max-width:640px){.nav{display:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Ein Monat mit dir</h1>
    <p class="lede">September und Oktober 2026. Jeder Aufruf zeigt vierzig andere Bilder.</p>
  </header>

  <div class="hero" id="hero">
    <img id="heroimg" alt="">
    <p class="cap" id="herocap"></p>
  </div>

  <div class="grid" id="grid"></div>

  <button class="again" id="again" type="button">Vierzig andere zeigen</button>

  <footer>
    <p id="count"></p>
  </footer>
</div>

<div id="lb">
  <div id="lbstage"><img id="lbimg" alt=""></div>
  <button class="nav" id="prev" type="button" aria-label="Zurück">&#8249;</button>
  <button class="nav" id="next" type="button" aria-label="Weiter">&#8250;</button>
  <button id="lbclose" type="button" aria-label="Schließen">&times;</button>
  <div id="lbn"></div>
  <div id="lbd"></div>
</div>

<script>
var PHOTOS = [];
var order = [];
var lbIndex = 0;
var SHOW = 40;

function shuffle(a){
  var r = a.slice();
  for (var i = r.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var t = r[i]; r[i] = r[j]; r[j] = t;
  }
  return r;
}

function ratioBox(el, p){
  el.style.aspectRatio = p.w + " / " + p.h;
}

function setSrc(img, src){
  img.dataset.tries = "0";
  img.onerror = function(){
    var n = parseInt(img.dataset.tries || "0", 10);
    if (n < 2) {
      img.dataset.tries = String(n + 1);
      window.setTimeout(function(){ img.src = src + "?r=" + Date.now(); }, 400 * (n + 1));
    }
  };
  img.src = src;
}

function render(){
  order = shuffle(PHOTOS).slice(0, Math.min(SHOW, PHOTOS.length));
  var hero = order[0];
  var hi = document.getElementById("heroimg");
  hi.alt = "Foto vom " + hero.d;
  ratioBox(hi, hero);
  setSrc(hi, "img/" + hero.f);
  document.getElementById("herocap").textContent = hero.d;

  var grid = document.getElementById("grid");
  grid.textContent = "";
  for (var i = 1; i < order.length; i++) {
    (function(p, idx){
      var cell = document.createElement("div");
      cell.className = "cell";
      var img = document.createElement("img");
      img.loading = "lazy";
      img.decoding = "async";
      img.alt = "Foto vom " + p.d;
      ratioBox(img, p);
      setSrc(img, "thumb/" + p.f);
      var d = document.createElement("span");
      d.className = "d";
      d.textContent = p.d;
      cell.appendChild(img);
      cell.appendChild(d);
      cell.addEventListener("click", function(){ openLb(idx); });
      grid.appendChild(cell);
    })(order[i], i);
  }
  document.getElementById("count").textContent =
    order.length + " von " + PHOTOS.length + " Bildern, vom 24. September bis 22. Oktober. Neu laden zeigt andere.";
  window.scrollTo({ top: 0, behavior: "smooth" });
}

var lb = document.getElementById("lb");
var lbstage = document.getElementById("lbstage");
var lbimg = document.getElementById("lbimg");
var lbd = document.getElementById("lbd");
var lbn = document.getElementById("lbn");

function show(i){
  lbIndex = (i % order.length + order.length) % order.length;
  var p = order[lbIndex];
  lbimg.alt = "Foto vom " + p.d;
  setSrc(lbimg, "img/" + p.f);
  lbd.textContent = p.d;
  lbn.textContent = (lbIndex + 1) + " / " + order.length;
  preload(lbIndex + 1);
  preload(lbIndex - 1);
}

function preload(i){
  var p = order[(i % order.length + order.length) % order.length];
  var im = new Image();
  im.src = "img/" + p.f;
}

function slideTo(dir){
  lbstage.classList.add("snap");
  lbstage.style.transform = "translateX(" + (dir > 0 ? "-100%" : "100%") + ")";
  window.setTimeout(function(){
    lbstage.classList.remove("snap");
    lbstage.style.transform = "translateX(" + (dir > 0 ? "100%" : "-100%") + ")";
    show(lbIndex + dir);
    window.requestAnimationFrame(function(){
      lbstage.classList.add("snap");
      lbstage.style.transform = "translateX(0)";
    });
  }, 220);
}

function resetStage(){
  lbstage.classList.remove("snap");
  lbstage.style.transform = "translateX(0)";
}

function openLb(i){
  resetStage();
  show(i);
  lb.classList.add("on");
  document.body.style.overflow = "hidden";
}
function closeLb(){
  lb.classList.remove("on");
  document.body.style.overflow = "";
  resetStage();
}

document.getElementById("hero").addEventListener("click", function(){ openLb(0); });
document.getElementById("lbclose").addEventListener("click", function(e){ e.stopPropagation(); closeLb(); });
document.getElementById("prev").addEventListener("click", function(e){ e.stopPropagation(); slideTo(-1); });
document.getElementById("next").addEventListener("click", function(e){ e.stopPropagation(); slideTo(1); });

document.addEventListener("keydown", function(e){
  if (!lb.classList.contains("on")) return;
  if (e.key === "Escape") closeLb();
  if (e.key === "ArrowLeft") slideTo(-1);
  if (e.key === "ArrowRight") slideTo(1);
});

var sx = 0, sy = 0, dragging = false, moved = false, dx = 0;

lb.addEventListener("touchstart", function(e){
  if (e.touches.length !== 1) { dragging = false; return; }
  sx = e.touches[0].clientX;
  sy = e.touches[0].clientY;
  dx = 0;
  dragging = true;
  moved = false;
  resetStage();
}, { passive: true });

lb.addEventListener("touchmove", function(e){
  if (!dragging) return;
  var x = e.touches[0].clientX - sx;
  var y = e.touches[0].clientY - sy;
  if (!moved && Math.abs(y) > Math.abs(x) && Math.abs(y) > 12) { dragging = false; return; }
  if (Math.abs(x) > 6) moved = true;
  dx = x;
  lbstage.style.transform = "translateX(" + x + "px)";
}, { passive: true });

lb.addEventListener("touchend", function(e){
  if (!dragging) return;
  dragging = false;
  var threshold = Math.min(90, window.innerWidth * 0.18);
  if (dx <= -threshold) { moved = true; slideTo(1); }
  else if (dx >= threshold) { moved = true; slideTo(-1); }
  else if (moved) {
    lbstage.classList.add("snap");
    lbstage.style.transform = "translateX(0)";
  }
  dx = 0;
}, { passive: true });

lb.addEventListener("click", function(e){
  if (moved) { moved = false; return; }
  if (e.target === lb || e.target === lbstage || e.target === lbimg) closeLb();
});

document.getElementById("again").addEventListener("click", render);

fetch("photos.json").then(function(r){ return r.json(); }).then(function(d){
  PHOTOS = d;
  render();
}).catch(function(){
  document.getElementById("count").textContent = "Die Bilder konnten nicht geladen werden.";
});
</script>
</body>
</html>
